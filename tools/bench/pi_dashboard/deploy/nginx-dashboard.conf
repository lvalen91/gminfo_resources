# GM Info 3.7 bench dashboard - replaces the placeholder default server.
# LAN-only, no auth (owner's explicit choice). Serves the static UI from /srv/www
# and reverse-proxies the FastAPI backend (REST at /api, WebSockets at /ws).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/www;
    index index.html;

    client_max_body_size 128m;   # APK uploads

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
